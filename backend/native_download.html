<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer"><title>Vesper Native · Private test</title>
  <style>
    body{margin:0;background:#03060f;color:#f4f8ff;font:18px sans-serif;min-height:100vh;display:grid;place-items:center}
    main{max-width:36rem;padding:32px;box-sizing:border-box;width:100%}h1{font-size:32px}
    button{background:#00b8ff;color:#03060f;border:0;border-radius:24px;padding:14px 24px;font:inherit;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}button:focus-visible{outline:3px solid #5cdfff;outline-offset:4px}
    p{line-height:1.5;overflow-wrap:anywhere}small{color:#a8b5c7}
  </style>
</head>
<body><main>
  <small data-testid="download-build-label">PRIVATE TEST · v{{VERSION}}</small>
  <h1 data-testid="download-title">Vesper Native</h1>
  <p id="status" role="status" aria-live="polite" data-testid="download-status">Ready to download your private test APK.</p>
  <button id="download" data-testid="download-apk-button">Download APK</button>
  <p><small data-testid="download-privacy-notice">This test build contains your prefilled login. Keep the APK and this link private.</small></p>
</main><script nonce="{{NONCE}}">{{SCRIPT}}</script></body>
</html>
