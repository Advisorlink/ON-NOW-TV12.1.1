<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sports Hub — design mockup (Live TV native screens)</title>
<style>
  html, body { margin: 0; background: #02050b; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #nav { height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 14px; background: #0d1322; border-bottom: 1px solid rgba(255,255,255,.08); font-size: 12px; }
  #nav a { color: #9DA5B5; text-decoration: none; padding: 5px 11px; border-radius: 999px; }
  #nav a.on { background: #5DC8FF; color: #061018; font-weight: 700; }
  #nav span { margin-left: auto; color: #5a6475; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
  #frame { width: 1920px; height: 1080px; transform-origin: top left; overflow: hidden; }
  .col { display: flex; flex-direction: column; }
  .row { display: flex; flex-direction: row; align-items: center; }
  .b { font-weight: 700; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .14em; }
  .mono:not(.b) { letter-spacing: .1em; }
  .pill { border-radius: 999px; padding: 16px 28px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.13); white-space: nowrap; display: inline-block; width: max-content; flex: none; overflow: visible !important; }
  .pill.focus { border: 4px solid #fff; padding: 13px 25px; transform: scale(1.06); }
  .focusable { border: 1px solid rgba(255,255,255,.13); box-sizing: border-box; }
  .focusable.focus { border-width: 4px; transform: scale(1.04); box-shadow: 0 24px 40px rgba(0,0,0,.45); position: relative; z-index: 2; }
  img { object-fit: contain; flex: none; }
  div { min-width: 0; }
  .col > div, .row > div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .col > div.row, .col > div.col, .row > div.row, .row > div.col, canvas { overflow: visible; white-space: normal; }
</style>
</head>
<body>
<div id="nav"><span>Mockup · 1920×1080 TV · xhdpi (1dp = 2px) · sample data</span></div>
<div id="frame"></div>
<script src="mock.js"></script>
</body>
</html>
