<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#06080F" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>ON NOW TV · Remote</title>
<style>
  :root{
    --bg:#06080F; --bg2:#0B1020; --ink:#EAF2FF; --muted:#7E8AA6;
    --cyan:#5DC8FF; --cyan-dim:#1B4459; --line:rgba(255,255,255,.08);
    --card:rgba(255,255,255,.045); --card-br:rgba(255,255,255,.09);
    --press:rgba(93,200,255,.22);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
  html,body{margin:0;height:100%;}
  body{
    background:radial-gradient(120% 90% at 50% -10%,#101a33 0%,var(--bg) 55%);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    overflow:hidden;position:fixed;inset:0;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #app{height:100%;display:flex;flex-direction:column;}
  .hidden{display:none!important;}
  .fade{animation:fade .35s ease both;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  /* ── Pair screen ── */
  #pair{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;gap:22px;}
  .brand{display:flex;align-items:center;gap:10px;letter-spacing:.34em;font-size:11px;font-weight:800;color:var(--cyan);text-transform:uppercase;}
  .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 14px var(--cyan);}
  #pair h1{font-size:26px;font-weight:800;margin:6px 0 0;text-align:center;line-height:1.2;}
  #pair p{color:var(--muted);font-size:14px;margin:0;text-align:center;max-width:300px;}
  .codebox{display:flex;gap:10px;margin-top:4px;}
  .codebox input{
    width:44px;height:58px;border-radius:14px;border:1.5px solid var(--card-br);
    background:var(--card);color:var(--ink);font-size:26px;font-weight:700;text-align:center;
    outline:none;transition:border-color .18s,box-shadow .18s,background .18s;
  }
  .codebox input:focus{border-color:var(--cyan);box-shadow:0 0 0 4px rgba(93,200,255,.16);background:rgba(93,200,255,.08);}
  .btn{
    appearance:none;border:none;border-radius:999px;padding:16px 30px;font-size:16px;font-weight:700;
    background:var(--cyan);color:#04121b;transition:transform .12s,opacity .18s,box-shadow .18s;
    box-shadow:0 10px 30px rgba(93,200,255,.28);cursor:pointer;
  }
  .btn:active{transform:scale(.96);}
  .btn[disabled]{opacity:.4;box-shadow:none;}
  .err{color:#ff6b7d;font-size:13px;min-height:16px;font-weight:600;}

  /* ── Remote screen ── */
  #remote{flex:1;display:flex;flex-direction:column;min-height:0;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 6px;}
  .pill{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;color:var(--muted);
    background:var(--card);border:1px solid var(--line);padding:7px 12px;border-radius:999px;letter-spacing:.02em;}
  .pill .live{width:7px;height:7px;border-radius:50%;background:#39d98a;box-shadow:0 0 10px #39d98a;}
  .iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);
    color:var(--ink);display:flex;align-items:center;justify-content:center;transition:transform .12s,background .15s;}
  .iconbtn:active{transform:scale(.9);background:var(--press);}

  .scroll{flex:1;min-height:0;overflow-y:auto;padding:6px 18px 20px;display:flex;flex-direction:column;gap:18px;
    -webkit-overflow-scrolling:touch;}

  /* Now playing */
  #nowplaying{border-radius:20px;overflow:hidden;position:relative;border:1px solid var(--card-br);
    background:var(--card);min-height:96px;}
  #np-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(18px) saturate(1.2);opacity:.5;transform:scale(1.15);}
  #np-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,8,15,.92),rgba(6,8,15,.55));}
  .np-inner{position:relative;display:flex;gap:14px;padding:14px;}
  #np-poster{width:64px;height:96px;border-radius:10px;object-fit:cover;background:#0d1424;flex:none;box-shadow:0 6px 18px rgba(0,0,0,.4);}
  .np-meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;}
  #np-title{font-size:17px;font-weight:800;line-height:1.2;}
  #np-sub{font-size:12px;color:var(--cyan);font-weight:600;letter-spacing:.02em;}
  #np-synopsis{font-size:12px;color:var(--muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  .progress{height:4px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:2px;}
  .progress > i{display:block;height:100%;background:var(--cyan);border-radius:4px;transition:width .5s linear;}

  /* D-pad */
  .dpad-wrap{display:flex;justify-content:center;padding:8px 0 4px;}
  .dpad{position:relative;width:min(74vw,290px);aspect-ratio:1;border-radius:50%;
    background:radial-gradient(closest-side,#0e1730,#0a0f1f);border:1px solid var(--card-br);
    box-shadow:inset 0 2px 20px rgba(0,0,0,.55),0 20px 50px rgba(0,0,0,.4);}
  .dbtn{position:absolute;display:flex;align-items:center;justify-content:center;color:var(--ink);
    background:transparent;border:none;transition:background .12s,transform .1s;}
  .dbtn:active{background:var(--press);}
  .dbtn.up,.dbtn.down{left:22%;right:22%;height:33%;}
  .dbtn.up{top:0;border-radius:0 0 0 0;align-items:flex-start;padding-top:18px;}
  .dbtn.down{bottom:0;align-items:flex-end;padding-bottom:18px;}
  .dbtn.left,.dbtn.right{top:22%;bottom:22%;width:33%;}
  .dbtn.left{left:0;justify-content:flex-start;padding-left:18px;}
  .dbtn.right{right:0;justify-content:flex-end;padding-right:18px;}
  .ok{position:absolute;left:29%;top:29%;width:42%;height:42%;border-radius:50%;
    background:linear-gradient(145deg,#5DC8FF,#2b9fe0);color:#04121b;font-weight:800;font-size:19px;border:none;
    box-shadow:0 8px 22px rgba(93,200,255,.4),inset 0 -3px 8px rgba(0,0,0,.2);transition:transform .1s,box-shadow .1s;}
  .ok:active{transform:scale(.93);box-shadow:0 4px 14px rgba(93,200,255,.5);}
  .ok.holding{transform:scale(.9);box-shadow:0 0 0 6px rgba(93,200,255,.28),0 4px 14px rgba(93,200,255,.5);}
  .dbtn svg,.ok svg{pointer-events:none;}

  .row{display:flex;gap:12px;}
  .keybtn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
    padding:14px 6px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);
    font-size:11px;font-weight:600;transition:transform .1s,background .15s;letter-spacing:.02em;}
  .keybtn:active{transform:scale(.94);background:var(--press);}
  .keybtn .lbl{color:var(--muted);}
  .vol .keybtn{padding:16px 6px;}

  .section-label{font-size:10.5px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:2px 2px -6px;}

  /* Keyboard sheet */
  #kbsheet{position:fixed;inset:0;background:rgba(4,6,12,.72);backdrop-filter:blur(6px);display:flex;
    align-items:flex-end;z-index:50;}
  .kb-card{width:100%;background:var(--bg2);border-radius:22px 22px 0 0;border-top:1px solid var(--card-br);
    padding:18px 18px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;
    animation:slideup .28s ease both;}
  @keyframes slideup{from{transform:translateY(100%);}to{transform:none;}}
  .kb-row{display:flex;gap:10px;align-items:center;}
  #kbinput{flex:1;height:52px;border-radius:14px;border:1.5px solid var(--card-br);background:var(--card);
    color:var(--ink);font-size:16px;padding:0 16px;outline:none;}
  #kbinput:focus{border-color:var(--cyan);}
  .toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:rgba(11,16,32,.95);
    border:1px solid var(--card-br);color:var(--ink);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;
    z-index:80;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div id="app">

  <!-- PAIR -->
  <section id="pair" class="fade">
    <div class="brand"><span class="dot"></span> ON NOW TV · REMOTE</div>
    <h1>Turn your phone<br/>into the remote</h1>
    <p>Enter the 6-digit code shown on your TV to connect to this box.</p>
    <div class="codebox" id="codebox">
      <input inputmode="numeric" maxlength="1" data-i="0"/>
      <input inputmode="numeric" maxlength="1" data-i="1"/>
      <input inputmode="numeric" maxlength="1" data-i="2"/>
      <input inputmode="numeric" maxlength="1" data-i="3"/>
      <input inputmode="numeric" maxlength="1" data-i="4"/>
      <input inputmode="numeric" maxlength="1" data-i="5"/>
    </div>
    <div class="err" id="pairErr"></div>
    <button class="btn" id="connectBtn" disabled>Connect</button>
  </section>

  <!-- REMOTE -->
  <section id="remote" class="hidden">
    <div class="topbar">
      <div class="pill"><span class="live"></span> <span id="connLabel">Connected</span></div>
      <button class="iconbtn" id="powerBtn" aria-label="power" data-key="POWER">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v9"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/></svg>
      </button>
    </div>

    <div class="scroll">
      <div id="nowplaying" class="hidden">
        <div id="np-bg"></div><div id="np-shade"></div>
        <div class="np-inner">
          <img id="np-poster" alt=""/>
          <div class="np-meta">
            <div id="np-title"></div>
            <div id="np-sub"></div>
            <div id="np-synopsis"></div>
            <div class="progress"><i id="np-bar" style="width:0%"></i></div>
          </div>
        </div>
      </div>

      <div class="dpad-wrap">
        <div class="dpad">
          <button class="dbtn up" data-key="DPAD_UP" aria-label="up">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
          </button>
          <button class="dbtn down" data-key="DPAD_DOWN" aria-label="down">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <button class="dbtn left" data-key="DPAD_LEFT" aria-label="left">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <button class="dbtn right" data-key="DPAD_RIGHT" aria-label="right">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
          </button>
          <button class="ok" id="okBtn">OK</button>
        </div>
      </div>

      <div class="row">
        <button class="keybtn" data-key="BACK">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 5 5v0a5 5 0 0 1-5 5H9"/></svg>
          <span>Back</span>
        </button>
        <button class="keybtn" data-key="HOME">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
          <span>Home</span>
        </button>
        <button class="keybtn" data-key="MENU">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          <span>Menu</span>
        </button>
      </div>

      <div class="row vol">
        <button class="keybtn" data-key="VOL_DOWN">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M17 9l4 4M21 9l-4 4"/></svg>
          <span class="lbl">Volume</span><span>Down</span>
        </button>
        <button class="keybtn" data-key="MEDIA_REWIND">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 19L2 12l9-7z"/><path d="M22 19l-9-7 9-7z"/></svg>
          <span>Rewind</span>
        </button>
        <button class="keybtn" id="ppBtn" data-key="MEDIA_PLAY_PAUSE">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
          <span>Play/Pause</span>
        </button>
        <button class="keybtn" data-key="MEDIA_FAST_FORWARD">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 19l9-7-9-7z"/><path d="M2 19l9-7-9-7z"/></svg>
          <span>Forward</span>
        </button>
        <button class="keybtn" data-key="VOL_UP">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
          <span class="lbl">Volume</span><span>Up</span>
        </button>
      </div>

      <div class="row">
        <button class="keybtn" id="kbBtn" style="flex:2">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 14h12"/></svg>
          <span>Keyboard</span>
        </button>
        <button class="keybtn" id="searchBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
          <span>Search</span>
        </button>
      </div>
    </div>
  </section>
</div>

<!-- Keyboard sheet -->
<div id="kbsheet" class="hidden">
  <div class="kb-card">
    <div class="section-label">Type on your TV</div>
    <div class="kb-row">
      <input id="kbinput" type="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" placeholder="Type here…"/>
    </div>
    <div class="kb-row">
      <button class="keybtn" id="kbBack" style="flex:1"><span>Delete</span></button>
      <button class="keybtn" id="kbEnter" style="flex:1"><span>Enter</span></button>
      <button class="btn" id="kbDone" style="flex:1.4">Done</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  // API base = current path minus trailing /remote, + /api/remote
  var ROOT = location.pathname.replace(/\/remote\/?$/,"");
  var API = location.origin + ROOT + "/api/remote";
  var params = new URLSearchParams(location.search);
  var SID = params.get("s") || "";
  var CODE = "";
  var statePoll = null;

  var $ = function(id){return document.getElementById(id);};
  function toast(msg){
    var t=$("toast"); t.textContent=msg; t.classList.add("show");
    clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove("show");},1400);
  }
  function haptic(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms||12);}catch(e){} }

  // ── Code entry ──
  var inputs = Array.prototype.slice.call(document.querySelectorAll("#codebox input"));
  inputs.forEach(function(inp,idx){
    inp.addEventListener("input",function(){
      inp.value = inp.value.replace(/[^0-9]/g,"").slice(0,1);
      if(inp.value && idx<5) inputs[idx+1].focus();
      refreshConnect();
    });
    inp.addEventListener("keydown",function(e){
      if(e.key==="Backspace" && !inp.value && idx>0) inputs[idx-1].focus();
    });
  });
  function currentCode(){ return inputs.map(function(i){return i.value;}).join(""); }
  function refreshConnect(){ $("connectBtn").disabled = currentCode().length!==6 || !SID; }

  if(!SID){ $("pairErr").textContent="Invalid link — rescan the QR on your TV."; }

  $("connectBtn").addEventListener("click", doPair);
  async function doPair(){
    var code = currentCode();
    $("connectBtn").disabled=true; $("pairErr").textContent="";
    try{
      var r = await fetch(API+"/pair",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({session_id:SID,code:code})});
      if(!r.ok){
        var d = await r.json().catch(function(){return{};});
        $("pairErr").textContent = d.detail==="bad_code" ? "Wrong code — check your TV."
          : d.detail==="session_not_found" ? "Session expired — rescan the QR." : "Couldn't connect. Try again.";
        $("connectBtn").disabled=false; return;
      }
      CODE = code;
      enterRemote();
    }catch(e){
      $("pairErr").textContent="Network error. Try again.";
      $("connectBtn").disabled=false;
    }
  }

  function enterRemote(){
    $("pair").classList.add("hidden");
    var rem=$("remote"); rem.classList.remove("hidden"); rem.classList.add("fade");
    requestFullscreenSoon();
    startStatePoll();
    haptic(20);
  }

  function requestFullscreenSoon(){
    try{
      var el=document.documentElement;
      var fn=el.requestFullscreen||el.webkitRequestFullscreen;
      if(fn) fn.call(el).catch(function(){});
    }catch(e){}
  }

  // ── Input send ──
  async function sendKey(key, longpress){
    haptic(12);
    try{
      await fetch(API+"/input/"+SID,{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({code:CODE, action:longpress?"longpress":"key", key:key})});
    }catch(e){ toast("Lost connection"); }
  }
  async function sendText(chars){
    if(!chars) return;
    try{
      await fetch(API+"/input/"+SID,{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({code:CODE, action:"text", chars:chars})});
    }catch(e){ toast("Lost connection"); }
  }

  // Bind all [data-key] buttons.
  document.querySelectorAll("[data-key]").forEach(function(btn){
    btn.addEventListener("click", function(){ sendKey(btn.getAttribute("data-key")); });
  });

  // OK button — supports press AND long-press (push-and-hold).
  var okBtn=$("okBtn"), holdTimer=null, didHold=false;
  function okStart(e){
    e.preventDefault(); didHold=false; okBtn.classList.add("holding");
    holdTimer=setTimeout(function(){ didHold=true; sendKey("DPAD_CENTER",true); haptic(30); },550);
  }
  function okEnd(e){
    e.preventDefault(); okBtn.classList.remove("holding");
    if(holdTimer){ clearTimeout(holdTimer); holdTimer=null; }
    if(!didHold) sendKey("DPAD_CENTER",false);
    didHold=false;
  }
  okBtn.addEventListener("touchstart", okStart, {passive:false});
  okBtn.addEventListener("touchend", okEnd, {passive:false});
  okBtn.addEventListener("touchcancel", function(){ okBtn.classList.remove("holding"); if(holdTimer){clearTimeout(holdTimer);holdTimer=null;} });
  okBtn.addEventListener("mousedown", okStart);
  okBtn.addEventListener("mouseup", okEnd);

  $("searchBtn").addEventListener("click", function(){ sendKey("SEARCH"); openKb(); });

  // ── Keyboard sheet ──
  var kb=$("kbsheet"), kbin=$("kbinput"), lastVal="";
  function openKb(){ kb.classList.remove("hidden"); kbin.value=""; lastVal=""; setTimeout(function(){kbin.focus();},80); }
  function closeKb(){ kb.classList.add("hidden"); kbin.blur(); }
  $("kbBtn").addEventListener("click", openKb);
  $("kbDone").addEventListener("click", closeKb);
  kb.addEventListener("click", function(e){ if(e.target===kb) closeKb(); });
  // Send characters as they are typed (diff against last value).
  kbin.addEventListener("input", function(){
    var v=kbin.value;
    if(v.length>lastVal.length && v.indexOf(lastVal)===0){
      sendText(v.slice(lastVal.length));
    } else if(v.length<lastVal.length){
      var dels=lastVal.length-v.length;
      for(var i=0;i<dels;i++) sendKey("DEL");
    } else if(v!==lastVal){
      // replaced — delete old, type new (rare)
      for(var j=0;j<lastVal.length;j++) sendKey("DEL");
      sendText(v);
    }
    lastVal=v;
  });
  $("kbBack").addEventListener("click", function(){ sendKey("DEL"); if(kbin.value){kbin.value=kbin.value.slice(0,-1);lastVal=kbin.value;} });
  $("kbEnter").addEventListener("click", function(){ sendKey("ENTER"); kbin.value="";lastVal=""; });

  // ── Now-playing poll ──
  function fmtTime(ms){ if(!ms)return""; var s=Math.floor(ms/1000);var m=Math.floor(s/60);var h=Math.floor(m/60);
    m=m%60; return h>0? h+"h "+m+"m" : m+"m"; }
  function renderNP(np){
    var box=$("nowplaying");
    if(!np || !np.title){ box.classList.add("hidden"); return; }
    box.classList.remove("hidden");
    $("np-title").textContent=np.title;
    var sub=[]; if(np.year)sub.push(np.year); if(np.rating)sub.push(np.rating); if(np.runtime)sub.push(np.runtime);
    $("np-sub").textContent=sub.join("  ·  ");
    $("np-synopsis").textContent=np.synopsis||"";
    var poster=$("np-poster");
    if(np.poster){ poster.src=np.poster; poster.style.display=""; } else poster.style.display="none";
    $("np-bg").style.backgroundImage = np.backdrop? "url('"+np.backdrop+"')" : (np.poster?"url('"+np.poster+"')":"");
    var pct = (np.duration_ms>0)? Math.min(100,(np.position_ms/np.duration_ms)*100):0;
    $("np-bar").style.width = pct+"%";
    var pp=$("ppBtn"); pp.querySelector("span").textContent = np.playing? "Pause":"Play";
  }
  async function pollState(){
    try{
      var r=await fetch(API+"/state/"+SID+"?code="+encodeURIComponent(CODE));
      if(r.status===404){ toast("Session ended"); stopStatePoll(); backToPair(); return; }
      if(!r.ok) return;
      var d=await r.json();
      renderNP(d.now_playing);
    }catch(e){}
  }
  function startStatePoll(){ pollState(); statePoll=setInterval(pollState, 2500); }
  function stopStatePoll(){ if(statePoll){clearInterval(statePoll);statePoll=null;} }
  function backToPair(){
    $("remote").classList.add("hidden"); $("pair").classList.remove("hidden");
    $("connectBtn").disabled=false; inputs.forEach(function(i){i.value="";});
  }

  document.addEventListener("visibilitychange", function(){
    if(document.hidden) stopStatePoll();
    else if(CODE) startStatePoll();
  });

  inputs[0] && inputs[0].focus();
})();
</script>
</body>
</html>
